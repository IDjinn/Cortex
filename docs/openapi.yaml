openapi: 3.0.4
info:
  title: Cortex API
  version: "2.0.0"
  description: |
    Backend HTTP+SSE para o Cortex, o ambiente de IA multi-provedor.
    Rotas com cadeado exigem JWT Bearer; as demais são anônimas.
    Chaves BYOK viajam no header `X-Provider-Key` (por requisição, nunca persistidas
    para uso anônimo); contas podem guardar chaves no cofre (`/api/keys`).
servers:
  - url: http://localhost:5172
    description: Dev local
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    providerKey:
      in: header
      name: X-Provider-Key
      required: false
      schema: { type: string }
      description: Chave BYOK do provedor (por requisição).
  schemas:
    ProviderKind:
      type: string
      enum: [OpenRouter, Ollama, LmStudio, OpenAI, Anthropic, Gemini, Xai, Mistral, DeepSeek]
    UserProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        provider: { type: string, enum: [Google, GitHub] }
        createdAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/UserProfile' }
    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        provider: { $ref: '#/components/schemas/ProviderKind' }
        model: { type: string }
        pinned: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messageCount: { type: integer }
        fallbackProvider: { type: string, nullable: true }
        fallbackModel: { type: string, nullable: true }
    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          properties:
            messages:
              type: array
              items: { $ref: '#/components/schemas/Message' }
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [User, Assistant, System, Tool] }
        content: { type: string }
        model: { type: string, nullable: true }
        tokensIn: { type: integer, nullable: true }
        tokensOut: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        costUsd: { type: number, nullable: true, description: Custo estimado do turno (USD). }
    Provider:
      type: object
      properties:
        kind: { $ref: '#/components/schemas/ProviderKind' }
        name: { type: string }
        isLocal: { type: boolean }
        requiresKey: { type: boolean }
        serverKeyConfigured: { type: boolean }
    Model:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        contextLength: { type: integer, nullable: true }
        promptPrice: { type: number, nullable: true, description: USD por 1M tokens de entrada. }
        completionPrice: { type: number, nullable: true, description: USD por 1M tokens de saída. }
        isDefault: { type: boolean }
        supportsTools: { type: boolean, nullable: true }
        supportsVision: { type: boolean, nullable: true }
    ProviderKey:
      type: object
      properties:
        provider: { $ref: '#/components/schemas/ProviderKind' }
        updatedAt: { type: string, format: date-time }
    Usage:
      type: object
      properties:
        provider: { $ref: '#/components/schemas/ProviderKind' }
        requests: { type: integer }
        tokensIn: { type: integer }
        tokensOut: { type: integer }
        costUsd: { type: number, nullable: true }
    Memory:
      type: object
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [Global, Project, Conversation] }
        conversationId: { type: string, format: uuid, nullable: true }
        source: { type: string, enum: [Manual, Extracted] }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error: { type: string }
        detail: { type: string, nullable: true }

paths:
  /health:
    get:
      security: []
      summary: Health check anônimo
      responses:
        '200': { description: ok }

  /api/auth/{provider}/login:
    get:
      security: []
      summary: Inicia fluxo OAuth (Google/GitHub)
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [google, github] }
        - in: query
          name: redirectUri
          required: true
          schema: { type: string }
      responses:
        '302': { description: Redirect para o provedor }

  /api/auth/{provider}/callback:
    get:
      security: []
      summary: Callback OAuth — redireciona para cortex://auth/callback
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [google, github] }
      responses:
        '302': { description: Redirect com AuthResponse na query `data` }

  /api/auth/refresh:
    post:
      security: []
      summary: Renova access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Novo par de tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Refresh inválido
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/auth/logout:
    post:
      summary: Revoga o refresh token
      responses:
        '204': { description: Revogado }

  /api/me:
    get:
      summary: Perfil do usuário autenticado
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } }
        '404': { description: Não encontrado }

  /api/providers:
    get:
      security: []
      summary: Catálogo de provedores (disponibilidade e requisito de chave)
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Provider' } }

  /api/models:
    get:
      security: []
      summary: Modelos de um provedor (cache 10min; bypass com chave/baseUrl)
      parameters:
        - { in: query, name: provider, required: true, schema: { $ref: '#/components/schemas/ProviderKind' } }
        - { in: query, name: refresh, schema: { type: boolean } }
        - { in: query, name: baseUrl, schema: { type: string }, description: "Só provedores locais (LM Studio/llama.cpp/Ollama remoto)." }
        - $ref: '#/components/parameters/providerKey'
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Model' } }
        '400':
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '502':
          description: Provedor inalcançável (ex.: Ollama desligado) ou erro upstream
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/keys:
    get:
      summary: Provedores com chave no cofre da conta (nunca retorna a chave)
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProviderKey' } }

  /api/keys/{provider}:
    put:
      summary: Salva a chave BYOK no cofre (criptografada em repouso)
      parameters:
        - { in: path, name: provider, required: true, schema: { $ref: '#/components/schemas/ProviderKind' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string }
      responses:
        '204': { description: Salva }
        '400':
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      summary: Remove a chave do cofre
      parameters:
        - { in: path, name: provider, required: true, schema: { $ref: '#/components/schemas/ProviderKind' } }
      responses:
        '204': { description: Removida }
        '404': { description: Não havia chave }

  /api/conversations:
    get:
      summary: Lista conversas (fixadas primeiro, depois recentes)
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
    post:
      summary: Cria nova conversa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, model]
              properties:
                title: { type: string }
                provider: { $ref: '#/components/schemas/ProviderKind' }
                model: { type: string }
      responses:
        '201':
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } }

  /api/conversations/import:
    post:
      summary: Migração guest → conta (importa conversas do dispositivo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversations]
              properties:
                conversations:
                  type: array
                  items:
                    type: object
                    required: [title, provider, model, pinned, messages]
                    properties:
                      title: { type: string }
                      provider: { $ref: '#/components/schemas/ProviderKind' }
                      model: { type: string }
                      pinned: { type: boolean }
                      messages:
                        type: array
                        items:
                          type: object
                          required: [role, content]
                          properties:
                            role: { type: string, enum: [User, Assistant, System] }
                            content: { type: string }
                            model: { type: string, nullable: true }
                            tokensIn: { type: integer, nullable: true }
                            tokensOut: { type: integer, nullable: true }
                            error: { type: string, nullable: true }
                            createdAt: { type: string, format: date-time, nullable: true }
                            costUsd: { type: number, nullable: true }
                memories:
                  type: array
                  description: Memórias globais do convidado (migradas como escopo Global).
                  items:
                    type: object
                    required: [content]
                    properties:
                      content: { type: string }
      responses:
        '200':
          description: "{ imported: n }"
        '400':
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/conversations/{id}:
    get:
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/ConversationDetail' } } }
    patch:
      summary: Atualiza título / pin / modelo / reserva (fallback)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                pinned: { type: boolean }
                provider: { $ref: '#/components/schemas/ProviderKind' }
                model: { type: string }
                fallbackProvider: { type: string, description: String vazio limpa a reserva. }
                fallbackModel: { type: string, description: String vazio limpa a reserva. }
      responses:
        '204': { description: Atualizada }
        '404': { description: Não encontrada }
    delete:
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removida }

  /api/usage:
    get:
      summary: Uso de tokens e custo estimado do mês (por provedor)
      parameters:
        - { in: query, name: month, schema: { type: string, description: "yyyy-MM (default: mês atual)" } }
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Usage' } }

  /api/memories:
    get:
      summary: Lista memórias do usuário (filtro opcional por escopo/conversa)
      parameters:
        - { in: query, name: scope, schema: { type: string, enum: [Global, Project, Conversation] } }
        - { in: query, name: conversationId, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Memory' } }
    post:
      summary: Cria uma memória
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, content]
              properties:
                scope: { type: string, enum: [Global, Project, Conversation] }
                conversationId: { type: string, format: uuid, nullable: true, description: Obrigatório quando scope=Conversation. }
                content: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Memory' }
        '400':
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /api/memories/{id}:
    patch:
      summary: Edita o conteúdo de uma memória
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '204': { description: Atualizada }
        '404': { description: Não encontrada }
    delete:
      summary: Remove uma memória
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removida }
        '404': { description: Não encontrada }

  /api/chat:
    post:
      summary: Streama uma rodada de chat autenticada (SSE)
      parameters:
        - $ref: '#/components/parameters/providerKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId, content]
              properties:
                conversationId: { type: string, format: uuid }
                content: { type: string }
                locale: { type: string }
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Eventos SSE (`event: <tipo>` + `data: <json>`):
                  - user { messageId } / assistant { messageId }
                  - token { value }
                  - reasoning { value } (cadeia de raciocínio de modelos reasoning, exibida separada da resposta; persistida em messages.reasoning)
                  - toolCall { id, name, arguments } (contrato da Fase 4)
                  - notice { message } (ex.: fallback acionado)
                  - done { tokensIn, tokensOut, provider, model, costUsd }
                  - memoryProposal { proposals: string[] } (extração automática pós-turno, aguarda confirmação do usuário)
                  - error { message }

  /api/chat/anonymous:
    post:
      security: []
      summary: Chat de convidado, stateless (SSE). Locais sempre; remotos exigem X-Provider-Key.
      parameters:
        - $ref: '#/components/parameters/providerKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, messages]
              properties:
                provider: { $ref: '#/components/schemas/ProviderKind' }
                model: { type: string, nullable: true }
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [User, Assistant, System] }
                      content: { type: string }
                temperature: { type: number }
                maxTokens: { type: integer }
                locale: { type: string }
                baseUrl: { type: string, description: "Só provedores locais." }
      responses:
        '200':
          description: text/event-stream (token / reasoning / usage / done / error)
        '403':
          description: Provedor remoto sem chave
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: Limite de requisições anônimas por IP
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
