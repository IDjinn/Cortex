openapi: 3.1.1
info:
  title: Cortex API
  version: "2.1.0"
  description: |
    Backend HTTP+SSE para o Cortex, o ambiente de IA multi-provedor.
    Rotas com cadeado exigem JWT Bearer; as demais são anônimas.
    Chaves BYOK viajam no header `X-Provider-Key` (por requisição, nunca persistidas
    para uso anônimo); contas podem guardar chaves no cofre (`/api/keys`).
servers:
  - url: http://localhost:5172
    description: Dev local
paths:
  /health:
    get:
      tags:
        - Cortex.Core
      responses:
        '200':
          description: OK
  /api/chat/anonymous:
    post:
      tags:
        - AnonymousChat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnonymousChatRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AnonymousChatRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AnonymousChatRequest'
        required: true
      responses:
        '200':
          description: OK
  /api/auth/{provider}/login:
    get:
      tags:
        - Auth
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: redirectUri
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
  /api/auth/{provider}/callback:
    get:
      tags:
        - Auth
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
  /api/auth/refresh:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: OK
  /api/auth/logout:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: OK
  /api/chat:
    post:
      tags:
        - Chat
      parameters:
        - name: X-Provider-Key
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: OK
  /api/conversations:
    get:
      tags:
        - Conversations
      responses:
        '200':
          description: OK
    post:
      tags:
        - Conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
        required: true
      responses:
        '200':
          description: OK
  /api/conversations/{id}:
    get:
      tags:
        - Conversations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
    patch:
      tags:
        - Conversations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
        required: true
      responses:
        '200':
          description: OK
    delete:
      tags:
        - Conversations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /api/conversations/import:
    post:
      tags:
        - Conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportConversationsRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ImportConversationsRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ImportConversationsRequest'
        required: true
      responses:
        '200':
          description: OK
  /api/keys:
    get:
      tags:
        - Keys
      responses:
        '200':
          description: OK
  /api/keys/{provider}:
    put:
      tags:
        - Keys
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProviderKeyRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SaveProviderKeyRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SaveProviderKeyRequest'
        required: true
      responses:
        '200':
          description: OK
    delete:
      tags:
        - Keys
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /api/me:
    get:
      tags:
        - Me
      responses:
        '200':
          description: OK
  /api/memories:
    get:
      tags:
        - Memories
      parameters:
        - name: scope
          in: query
          schema:
            $ref: '#/components/schemas/MemoryScope'
        - name: conversationId
          in: query
          schema:
            type: string
            format: uuid
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
    post:
      tags:
        - Memories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemoryRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateMemoryRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateMemoryRequest'
        required: true
      responses:
        '200':
          description: OK
  /api/memories/bulk-delete:
    post:
      tags:
        - Memories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteMemoriesRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteMemoriesRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/BulkDeleteMemoriesRequest'
        required: true
      responses:
        '200':
          description: OK
  /api/memories/clear:
    post:
      tags:
        - Memories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearMemoriesRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ClearMemoriesRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ClearMemoriesRequest'
        required: true
      responses:
        '200':
          description: OK
  /api/memories/{id}:
    patch:
      tags:
        - Memories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemoryRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateMemoryRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateMemoryRequest'
        required: true
      responses:
        '200':
          description: OK
    delete:
      tags:
        - Memories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /api/models:
    get:
      tags:
        - Models
      parameters:
        - name: provider
          in: query
          schema:
            type: string
        - name: refresh
          in: query
          schema:
            type: boolean
            default: false
        - name: X-Provider-Key
          in: header
          schema:
            type: string
        - name: baseUrl
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
  /api/projects:
    get:
      tags:
        - Projects
      responses:
        '200':
          description: OK
    post:
      tags:
        - Projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
        required: true
      responses:
        '200':
          description: OK
  /api/projects/{id}:
    patch:
      tags:
        - Projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
        required: true
      responses:
        '200':
          description: OK
    delete:
      tags:
        - Projects
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /api/providers:
    get:
      tags:
        - Providers
      responses:
        '200':
          description: OK
  /api/usage:
    get:
      tags:
        - Usage
      parameters:
        - name: month
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
components:
  schemas:
    AnonymousChatMessage:
      required:
        - role
        - content
      type: object
      properties:
        role:
          $ref: '#/components/schemas/MessageRole'
        content:
          type: string
    AnonymousChatRequest:
      required:
        - provider
        - model
        - messages
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/ChatProviderKind'
        model:
          type:
            - 'null'
            - string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AnonymousChatMessage'
        temperature:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
          type:
            - 'null'
            - number
            - string
          format: double
        maxTokens:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - 'null'
            - integer
            - string
          format: int32
        locale:
          type:
            - 'null'
            - string
        baseUrl:
          type:
            - 'null'
            - string
    BulkDeleteMemoriesRequest:
      required:
        - ids
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
    ChatProviderKind:
      type: integer
    ChatRequest:
      required:
        - conversationId
        - content
      type: object
      properties:
        conversationId:
          type: string
          format: uuid
        content:
          type: string
        locale:
          type:
            - 'null'
            - string
    ClearMemoriesRequest:
      required:
        - scope
        - projectId
        - conversationId
      type: object
      properties:
        scope:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/MemoryScope'
        projectId:
          type:
            - 'null'
            - string
          format: uuid
        conversationId:
          type:
            - 'null'
            - string
          format: uuid
    CreateConversationRequest:
      required:
        - title
        - provider
        - model
      type: object
      properties:
        title:
          type:
            - 'null'
            - string
        provider:
          $ref: '#/components/schemas/ChatProviderKind'
        model:
          type: string
        projectId:
          type:
            - 'null'
            - string
          format: uuid
    CreateMemoryRequest:
      required:
        - scope
        - conversationId
        - projectId
        - content
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/MemoryScope'
        conversationId:
          type:
            - 'null'
            - string
          format: uuid
        projectId:
          type:
            - 'null'
            - string
          format: uuid
        content:
          type: string
    CreateProjectRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
        parentId:
          type:
            - 'null'
            - string
          format: uuid
    ImportConversationDto:
      required:
        - title
        - provider
        - model
        - pinned
        - messages
      type: object
      properties:
        title:
          type: string
        provider:
          $ref: '#/components/schemas/ChatProviderKind'
        model:
          type: string
        pinned:
          type: boolean
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ImportMessageDto'
    ImportConversationsRequest:
      required:
        - conversations
      type: object
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ImportConversationDto'
        memories:
          type:
            - 'null'
            - array
          items:
            $ref: '#/components/schemas/ImportMemoryDto'
    ImportMemoryDto:
      required:
        - content
      type: object
      properties:
        content:
          type: string
    ImportMessageDto:
      required:
        - role
        - content
        - model
        - tokensIn
        - tokensOut
        - error
        - createdAt
      type: object
      properties:
        role:
          $ref: '#/components/schemas/MessageRole'
        content:
          type: string
        model:
          type:
            - 'null'
            - string
        tokensIn:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - 'null'
            - integer
            - string
          format: int32
        tokensOut:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - 'null'
            - integer
            - string
          format: int32
        error:
          type:
            - 'null'
            - string
        createdAt:
          type:
            - 'null'
            - string
          format: date-time
        costUsd:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - 'null'
            - number
            - string
          format: double
    MemoryScope:
      type: integer
    MessageRole:
      type: integer
    RefreshRequest:
      required:
        - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
    SaveProviderKeyRequest:
      required:
        - key
      type: object
      properties:
        key:
          type: string
    UpdateConversationRequest:
      required:
        - title
        - pinned
      type: object
      properties:
        title:
          type:
            - 'null'
            - string
        pinned:
          type:
            - 'null'
            - boolean
        provider:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ChatProviderKind'
        model:
          type:
            - 'null'
            - string
        fallbackProvider:
          type:
            - 'null'
            - string
        fallbackModel:
          type:
            - 'null'
            - string
        projectId:
          type:
            - 'null'
            - string
    UpdateMemoryRequest:
      required:
        - content
      type: object
      properties:
        content:
          type: string
    UpdateProjectRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
tags:
  - name: Cortex.Core
  - name: AnonymousChat
  - name: Auth
  - name: Chat
  - name: Conversations
  - name: Keys
  - name: Me
  - name: Memories
  - name: Models
  - name: Projects
  - name: Providers
  - name: Usage

